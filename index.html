<style>
@font-face{font-family:'DotGothic16';src:url(dotgothic16.woff2) format('woff2');font-display:swap}
@font-face{font-family:'DotGothic16';src:url(dotgothic16-ext.woff2) format('woff2');font-display:swap;unicode-range:U+0100-024F,U+1E00-1EFF}
@font-face{font-family:'Press Start 2P';src:url(pressstart2p.woff2) format('woff2');font-display:swap}

/* ===== temas ===== */
body.th-light{--bg:#e9edf8;--w1:#ffffff;--w2:#eef1fb;--line:#3c4a9e;--gold:#a8650a;--xp:#1aa86a;--hp:#d6334f;--mut:#5b648f;--txt:#1b2142;
 --p1:#f2f4fd;--p2:#e1e6f6;--p3:#d6defa;--sh:#c3cae6;--sh2:#dfe4f4;--b0:#1b21421a;--b1:#1b214222;--b2:#1b214230;--b3:#1b214244;--b4:#1b214255;--b5:#1b214266;
 background:radial-gradient(ellipse at 50% -10%,#cfd8ff 0%,#e9edf8 60%) fixed}
body.th-light .win{box-shadow:0 0 0 3px var(--sh),0 6px 14px rgba(40,50,110,.18)}
body.th-light .tabs{background:linear-gradient(180deg,transparent,#dfe4f4 35%)}
body.th-light .tabs button.on{background:#3c4a9e1f}
body.th-light .btn.ghost{color:var(--txt)}
body.th-light .bar>i{background:linear-gradient(180deg,#8ff0c4,var(--xp) 45%,#0f7a4c)}
body.th-light .ov{background:rgba(30,36,70,.45)}
body.th-dracula{--bg:#282a36;--w1:#343746;--w2:#282a36;--line:#bd93f9;--gold:#f1fa8c;--xp:#50fa7b;--hp:#ff5555;--mut:#a3acd6;--txt:#f8f8f2;
 --p1:#21222c;--p2:#191a21;--p3:#44475a;--sh:#191a21;--sh2:#1e1f29;--b0:#f8f8f21a;--b1:#6272a455;--b2:#6272a466;--b3:#6272a488;--b4:#6272a4aa;--b5:#6272a4cc;
 background:radial-gradient(1px 1px at 20% 30%,#f8f8f255,transparent),radial-gradient(1px 1px at 70% 10%,#bd93f955,transparent),radial-gradient(1px 1px at 85% 60%,#ff79c655,transparent),radial-gradient(ellipse at 50% -10%,#44475a 0%,#282a36 60%) fixed}
body.th-dracula .win h2{color:#ff79c6}
body.th-dracula .tabs button.on{color:#f8f8f2;background:#bd93f933}
body.th-dracula .btn{background:linear-gradient(180deg,#ffd3a3,#ffb86c);border-color:#ffe2c2;color:#282a36;box-shadow:0 3px 0 #a86a2a}
body.th-dracula .btn.blue{background:linear-gradient(180deg,#d6bcff,#bd93f9);border-color:#e9dcff;color:#282a36;box-shadow:0 3px 0 #6a4aa8}
body.th-dracula .btn.red{background:linear-gradient(180deg,#ff8a8a,#ff5555);border-color:#ffc4c4;color:#282a36;box-shadow:0 3px 0 #a82a2a}
body.th-dracula .btn.ghost{background:var(--p1);color:var(--txt);border-color:#6272a4;box-shadow:none}
body.th-dracula .bar>i{background:linear-gradient(180deg,#b6ffc8,#50fa7b 45%,#2aa84c)}
body.th-dracula .tabs{background:linear-gradient(180deg,transparent,#1e1f29 35%)}
body.th-dracula .ov{background:rgba(15,16,22,.75)}
/* ===== layout moderno ===== */
body.lay-modern,body.lay-modern button,body.lay-modern input,body.lay-modern select,body.lay-modern textarea{font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;letter-spacing:.1px}
body.lay-modern .px{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-weight:800;letter-spacing:1px}
body.lay-modern .win{border:1px solid var(--b3);border-radius:18px;background:linear-gradient(160deg,color-mix(in srgb,var(--w1) 88%,transparent),color-mix(in srgb,var(--w2) 92%,transparent));
 box-shadow:0 10px 30px rgba(0,0,0,.28),inset 0 1px 0 var(--b2);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);padding:14px 14px 12px}
body.lay-modern .win::before{content:'';position:absolute;left:18px;right:18px;top:0;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.8}
body.lay-modern .win h2{font-size:15px;font-weight:700;text-transform:uppercase;letter-spacing:1.6px}
body.lay-modern .win h2 .cnt{text-transform:none;letter-spacing:0;font-weight:500}
body.lay-modern .btn{border:0;border-radius:999px;box-shadow:0 4px 12px rgba(0,0,0,.25);font-weight:700;padding:9px 16px}
body.lay-modern .btn.sm{padding:6px 12px;font-size:13px}
body.lay-modern .btn:active{transform:scale(.97);box-shadow:0 2px 6px rgba(0,0,0,.25)}
body.lay-modern .btn.ghost{background:var(--b0);border:1px solid var(--b3);box-shadow:none}
body.lay-modern .bar{height:8px;border:0;border-radius:99px;background:var(--b1)}
body.lay-modern .bar>i{border-radius:99px;box-shadow:0 0 10px var(--xp)}
body.lay-modern .bar.hp>i{box-shadow:0 0 10px var(--hp)}
body.lay-modern .avatar{border:0;border-radius:16px;background:radial-gradient(circle at 50% 30%,var(--p3),var(--p1));box-shadow:0 0 0 2px var(--gold),0 6px 16px rgba(0,0,0,.3)}
body.lay-modern .chip{border:1px solid var(--b2);border-radius:999px;padding:3px 10px;background:var(--b0)}
body.lay-modern .q{border-top:1px solid var(--b1);padding:10px 4px}
body.lay-modern .q .mon,body.lay-modern .kv,body.lay-modern .best div,body.lay-modern .ach div,body.lay-modern .invitem,body.lay-modern .evo div,body.lay-modern .tplpack,body.lay-modern .inv{border:1px solid var(--b2);border-radius:12px}
body.lay-modern .rw,body.lay-modern .log div,body.lay-modern .tplit,body.lay-modern .sfx{border-top-style:solid;border-top-width:1px}
body.lay-modern .seg{background:var(--b0);border-radius:999px;padding:3px;gap:3px}
body.lay-modern .seg button{border:0;border-radius:999px;background:transparent;font-weight:600}
body.lay-modern .seg button.on{background:var(--p3);box-shadow:0 2px 8px rgba(0,0,0,.25)}
body.lay-modern .pick button,body.lay-modern .days button,body.lay-modern .classes button{border-width:1px;border-radius:12px}
body.lay-modern .in{border:1px solid var(--b3);border-radius:12px}
body.lay-modern .tabs{background:none;padding-bottom:calc(env(safe-area-inset-bottom) + 12px)}
body.lay-modern .tabs .in{border:1px solid var(--b3);border-radius:22px;box-shadow:0 10px 30px rgba(0,0,0,.35);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
 background:color-mix(in srgb,var(--w2) 85%,transparent)}
body.lay-modern .tabs button{border-radius:16px;font-size:11px;font-weight:600}
body.lay-modern .tabs button.on{background:linear-gradient(180deg,var(--p3),transparent);color:var(--gold)}
body.lay-modern .ov .win{border-radius:22px}
/* seletor de aparência */
.lookpick{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0 4px}
.lookpick.c2{grid-template-columns:1fr 1fr}
.lookpick button{background:var(--p1);border:2px solid var(--b3);border-radius:10px;padding:6px 4px;color:var(--txt);font-size:13px;display:flex;flex-direction:column;align-items:center;gap:5px}
.lookpick button.on{border-color:var(--gold);box-shadow:0 0 0 2px color-mix(in srgb,var(--gold) 35%,transparent)}
.lookpick .sw{width:100%;height:30px;border-radius:6px;display:flex;overflow:hidden;border:1px solid #0003}
.lookpick .sw i{flex:1}
.lookpick .lay{width:100%;height:30px;border-radius:6px;display:grid;place-items:center;font-size:11px}
.mastb{margin:2px 0 8px;padding:6px 8px;border:1px solid var(--gold,#e8c35a);border-radius:6px;font-size:13px;color:var(--gold,#e8c35a)}
.q.done.hasx{opacity:.92}.xcol{display:flex;flex-direction:column;align-items:center;gap:2px}.xcol small{font-size:11px}
.xbtn{background:linear-gradient(#ffe27a,#e0a92a)!important;color:#3a2600!important}.xbtn[disabled]{filter:grayscale(1);opacity:.5}
.exb{color:#ffd447;font-weight:normal}.q{position:relative}.q.crit{animation:crit .45s}
@keyframes crit{0%{transform:translateX(0)}20%{transform:translateX(-4px);box-shadow:0 0 0 2px #ffd447}40%{transform:translateX(4px)}60%{transform:translateX(-2px)}100%{transform:none}}
.critpop{position:absolute;right:12px;top:-4px;color:#ffd447;font-size:11px;text-shadow:0 2px 0 #000;animation:critpop .9s forwards;pointer-events:none}
@keyframes critpop{0%{opacity:0;transform:translateY(8px) scale(.6)}30%{opacity:1;transform:translateY(-4px) scale(1.15)}100%{opacity:0;transform:translateY(-18px)}}
</style>
<style>
:root{--p1:#0a1050;--p2:#050833;--p3:#1d2a85;--sh:#04062a;--sh2:#05072a;--b0:#ffffff1a;--b1:#ffffff22;--b2:#ffffff33;--b3:#ffffff44;--b4:#ffffff55;--b5:#ffffff66;--bg:#0b0f2a;--w1:#26348f;--w2:#111952;--line:#e9ecff;--gold:#ffd447;--xp:#4dffb0;--hp:#ff5470;--mut:#aab2e6;--txt:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:'DotGothic16',monospace;font-size:16px;line-height:1.35}
body{min-height:100vh;background:
 radial-gradient(1px 1px at 20% 30%,#fff8,transparent),radial-gradient(1px 1px at 70% 10%,#fff6,transparent),
 radial-gradient(1px 1px at 40% 80%,#fff5,transparent),radial-gradient(1px 1px at 85% 60%,#fff7,transparent),
 radial-gradient(1px 1px at 10% 70%,#fff5,transparent),radial-gradient(ellipse at 50% -10%,#2b1f6b 0%,#0b0f2a 60%);background-attachment:fixed}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
.app{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 150px)}
.px{font-family:'Press Start 2P',monospace;letter-spacing:.5px}
.win{position:relative;background:linear-gradient(180deg,var(--w1),var(--w2));border:3px solid var(--line);border-radius:10px;
 box-shadow:0 0 0 3px var(--sh),inset 0 0 0 2px var(--p1),0 6px 0 3px rgba(0,0,0,.35);padding:12px;margin-bottom:14px}
.win h2{margin:0 0 10px;font-size:17px;font-weight:normal;color:var(--gold);display:flex;align-items:center;gap:8px}
.win h2 .cnt{margin-left:auto;font-size:13px;color:var(--mut)}
.mut{color:var(--mut)}
.spr{image-rendering:pixelated;display:block}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
/* header */
.hdr .row{align-items:flex-start}
.avatar{width:64px;height:70px;border:2px solid var(--line);border-radius:8px;background:var(--p1);display:grid;place-items:center;flex-shrink:0}
.name{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:13px;color:var(--mut)}
.lv{font-size:11px;color:var(--gold)}
.bar{height:12px;border:2px solid var(--line);background:var(--p2);border-radius:3px;overflow:hidden;margin-top:4px}
.bar>i{display:block;height:100%;background:linear-gradient(180deg,#b5ffe0,var(--xp) 45%,#18a86c);transition:width .6s}
.bar.hp>i{background:linear-gradient(180deg,#ffb3c1,var(--hp) 45%,#b02040)}
.bar.st>i{background:linear-gradient(180deg,#fff,currentColor 45%,currentColor)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{font-size:12px;padding:3px 7px;border:2px solid var(--b4);border-radius:6px;background:var(--p1);white-space:nowrap}
.chip b{color:var(--gold);font-weight:normal}
/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:8px 10px calc(env(safe-area-inset-bottom) + 8px);background:linear-gradient(180deg,transparent,var(--sh2) 35%)}
.tabs .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);gap:3px;background:linear-gradient(180deg,var(--w1),var(--w2));border:3px solid var(--line);border-radius:10px;padding:6px;box-shadow:0 0 0 3px var(--sh)}
.tabs button{background:none;border:0;padding:6px 2px;border-radius:6px;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--mut)}
.tabs button .ic{font-size:18px;line-height:1}
.tabs button.on{color:var(--txt);background:var(--b0)}

@keyframes blink{50%{opacity:0}}
/* buttons */
.btn{background:linear-gradient(180deg,#ffe58a,#e2a92a);color:#2a1800;border:3px solid #fff3c4;border-radius:8px;padding:8px 12px;box-shadow:0 3px 0 #6e4a00;cursor:pointer;white-space:nowrap}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #6e4a00}
.btn:disabled{filter:grayscale(1) brightness(.6);cursor:not-allowed}
.btn.blue{background:linear-gradient(180deg,#7fb2ff,#3a63d8);color:#fff;border-color:#cfe0ff;box-shadow:0 3px 0 #1b2f78}
.btn.red{background:linear-gradient(180deg,#ff8a9a,#d2334f);color:#fff;border-color:#ffd0d8;box-shadow:0 3px 0 #6e1424}
.btn.ghost{background:var(--p1);color:var(--txt);border-color:var(--b5);box-shadow:none}
.btn.sm{padding:5px 9px;font-size:14px}
.btn.wide{width:100%;padding:12px;font-size:17px}
.fab{position:fixed;right:max(14px,calc(50% - 226px));bottom:calc(env(safe-area-inset-bottom) + 92px);z-index:19}
/* quests */
.q{display:flex;align-items:center;gap:10px;padding:9px 4px;border-top:2px dashed var(--b1)}
.q:first-of-type{border-top:0}
.q .mon{width:40px;height:40px;flex-shrink:0;display:grid;place-items:center;background:var(--p1);border-radius:6px;border:2px solid var(--b2)}
.q .t{font-size:16px;word-break:break-word;cursor:pointer}
.q .meta{font-size:12px;color:var(--mut);display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.q .meta .late{color:#ff7d8f}
.q.done{opacity:.5}
.q.done .t{text-decoration:line-through}
.dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:3px;vertical-align:middle}
.seg{display:flex;gap:6px;margin-bottom:12px}
.seg button{flex:1;background:var(--p1);border:2px solid var(--b3);border-radius:8px;padding:7px 4px;color:var(--mut);font-size:14px}
.seg button.on{border-color:var(--gold);color:var(--txt);background:var(--p3)}
.empty{text-align:center;color:var(--mut);padding:8px 0}
details summary{cursor:pointer;color:var(--mut);list-style:none;padding:4px 0}
details summary::-webkit-details-marker{display:none}
/* textbox */
.tb{font-size:16px;min-height:3em;white-space:pre-line}
.tb .who{color:var(--gold)}
.sugg{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.sugg button{text-align:left}
/* forms */
label.f{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
.in{width:100%;background:var(--p2);border:2px solid var(--b5);border-radius:6px;padding:10px;outline:none}
.in:focus{border-color:var(--gold)}
.pick{display:grid;gap:6px}
.pick.c2{grid-template-columns:1fr 1fr}.pick.c4{grid-template-columns:repeat(4,1fr)}
.pick button{background:var(--p1);border:2px solid var(--b3);border-radius:8px;padding:7px 4px;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--txt)}
.pick button.on{border-color:var(--gold);background:var(--p3);box-shadow:0 0 0 2px #ffd44755}
.pick small{color:var(--mut);font-size:11px}
/* modal */
.ov{position:fixed;inset:0;z-index:50;background:rgba(2,3,20,.72);display:none;align-items:center;justify-content:center;padding:16px}
.ov.show{display:flex}
.ov .win{width:100%;max-width:440px;max-height:88vh;overflow:auto;margin:0;animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(.9);opacity:0}}
.actions{display:flex;gap:8px;margin-top:14px}.actions .btn{flex:1}
/* battle */
.battle{position:fixed;inset:0;z-index:60;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;
 background:radial-gradient(ellipse at 50% 60%,#3a2a8a,#07092a 70%)}
.battle.show{display:flex}
.battle .stage{position:relative;height:190px;display:grid;place-items:center;width:100%}
.battle .ground{position:absolute;bottom:18px;width:200px;height:24px;border-radius:50%;background:#00000055}
.battle .foe{position:relative;animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.battle .foe.hit{animation:shake .35s linear 2;filter:brightness(3)}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.battle .foe.dead{animation:die .7s forwards}
@keyframes die{to{opacity:0;transform:scale(1.3) translateY(10px);filter:brightness(4) blur(2px)}}
.dmg{position:absolute;top:20px;font-size:26px;color:#fff;text-shadow:3px 3px 0 #c8143a;animation:dmg 1s forwards;opacity:0}
@keyframes dmg{0%{opacity:1;transform:translateY(20px)}60%{opacity:1;transform:translateY(-20px)}100%{opacity:0;transform:translateY(-30px)}}
.slash{position:absolute;width:160px;height:6px;background:#fff;transform:rotate(-35deg) scaleX(0);box-shadow:0 0 12px #fff;opacity:0}
.slash.go{animation:slash .25s ease-out}
@keyframes slash{0%{opacity:1;transform:rotate(-35deg) scaleX(0)}100%{opacity:0;transform:rotate(-35deg) scaleX(1.2)}}
.battle .win{width:100%;max-width:440px}
.arena{max-width:380px}
.arena .gnd{position:absolute;bottom:14px;width:120px;height:18px;border-radius:50%;background:#00000055}
.hb{position:absolute;left:8%;bottom:20px;z-index:2}
.hb>*{display:block}
.foe2{position:absolute;right:8%;bottom:16px}
.foe2 .bob{animation:bob 1.2s ease-in-out infinite}
.hb.dash{animation:dashA .3s ease-in forwards}
@keyframes dashA{0%{transform:translate(0,0)}45%{transform:translate(calc(var(--dx)*.55),-20px)}100%{transform:translate(var(--dx),0)}}
.hb.ret{animation:retA .3s ease-out forwards}
@keyframes retA{0%{transform:translate(var(--dx),0)}50%{transform:translate(calc(var(--dx)*.45),-16px)}100%{transform:translate(0,0)}}
.hb.cast{animation:castA .4s ease-out}
@keyframes castA{40%{transform:translateY(-12px);filter:brightness(1.7) drop-shadow(0 0 8px #9cf)}}
.hb.victory{animation:vic .45s ease-in-out 2}
@keyframes vic{50%{transform:translateY(-18px)}}
.foe2.hit .bob{animation:shake2 .18s linear;filter:brightness(3)}
@keyframes shake2{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.foe2.poof .bob{animation:poofA .5s forwards}
@keyframes poofA{0%{filter:brightness(1)}25%{filter:brightness(6);transform:scale(1.12,.92)}100%{opacity:0;transform:scale(1.4,.15) translateY(40px);filter:brightness(6)}}
.puff{position:absolute;width:var(--s);height:var(--s);background:#eeecf8;box-shadow:inset -3px -3px 0 #aaa6c8;opacity:0;animation:puffA .85s ease-out forwards;z-index:3}
.puff.dk{background:#c8c4de;box-shadow:inset -3px -3px 0 #8a86a8}
@keyframes puffA{0%{opacity:1;transform:translate(-50%,-50%) scale(.3)}55%{opacity:.95}100%{opacity:0;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(1.5)}}
.slash2{position:absolute;width:170px;height:8px;background:var(--fx,#fff);box-shadow:0 0 10px var(--fx,#fff),0 0 20px var(--fx,#9cf);transform:translate(-50%,-50%) rotate(var(--r,-38deg)) scaleX(0);animation:slash2 .28s ease-out forwards;z-index:4}
@keyframes slash2{0%{opacity:1;transform:translate(-50%,-50%) rotate(var(--r,-38deg)) scaleX(0)}60%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) rotate(var(--r,-38deg)) scaleX(1.15)}}
.burst{position:absolute;width:26px;height:26px;background:var(--fx,#fff);clip-path:polygon(50% 0,62% 36%,100% 50%,62% 64%,50% 100%,38% 64%,0 50%,38% 36%);transform:translate(-50%,-50%) scale(.3);animation:burst .3s ease-out forwards;z-index:4}
.burst.big{width:40px;height:40px;animation-duration:.4s}
@keyframes burst{0%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(3.2) rotate(45deg)}}
.proj{position:absolute;transform:translate(-50%,-50%);animation:projA .32s linear forwards;z-index:4}
.proj.orb{width:16px;height:16px;background:#ffffff;box-shadow:0 0 0 3px var(--fx),0 0 14px 4px var(--fx)}
.proj.note{font-size:26px;color:var(--fx);text-shadow:2px 2px 0 #00000088}
@keyframes projA{to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy)))}}
.arena.quake{animation:quake .22s linear}

 g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(AC.destination);o.start(n);o.stop(n+d+.03)}catch(e){}}

function checkDay(){const h=new Date().getHours();if(h<7)S.stats.early++;if(h>=23)S.stats.late++;
 const t=today(),cats=new Set(S.log.filter(l=>l.c&&l.xp>0&&dstr(new Date(l.t))===t).map(l=>l.c));if(cats.size>=4&&S.stats.lastAllcat!==t){S.stats.allcat++;S.stats.lastAllcat=t}
 const dl=QA().filter(q=>q.type==='daily'&&qActive(q));if(dl.length>=3&&dl.every(qDone)&&S.stats.lastPerfect!==t){S.stats.perfect++;S.stats.lastPerfect=t}}
function checkAch(){const got=[];for(let i=0;i<3;i++)ACH.forEach(a=>{if(!S.ach[a[0]]&&a[3](S)){S.ach[a[0]]=Date.now();const g=achGold(a[0]);S.gold+=g;S.stats.goldEarned+=g;addLog('🏆 Conquista: '+a[1]+' (+'+g+' G)',0,g);got.push(a)}});if(S.ach.ex50&&!S.owned.includes('n:ex_dev'))S.owned.push('n:ex_dev');return got}

function touchStreak(){const t=today();if(S.lastActive===t)return;S.streak=S.lastActive===yesterday()?S.streak+1:1;S.lastActive=t;S.best=Math.max(S.best,S.streak)}
function markMastery(){S.mastered=S.mastered||{};const c=S.hero.cls;S.mastered[c]={asc:S.asc||(S.mastered[c]&&S.mastered[c].asc)||null};
 const n=Object.keys(S.mastered).length;TITLE_MS.forEach(([k,id])=>{if(n>=k&&!owns('n:'+id))S.owned.push('n:'+id)})}
function levelLoop(){const ups=[];while(S.level<MAX_LV&&S.xp>=need(S.level)){S.xp-=need(S.level);S.level++;if(S.hpMode)S.hp=100;const bonus=S.level*10;S.gold+=bonus;
  const tl=TITLE_LV.find(t=>t[0]===S.level);let tt=null;if(tl&&!owns('n:'+tl[1])){S.owned.push('n:'+tl[1]);tt=tl[2]}ups.push({lv:S.level,bonus,tt});if(S.level>=MAX_LV&&S.asc&&!S.ascBoth){S.ascBoth=true;if(!owns('n:asc_b'))S.owned.push('n:asc_b')}if(S.level>=MAX_LV)markMastery()}if(S.level>=MAX_LV)S.xp=Math.min(S.xp,need(MAX_LV));return ups}
function award(bx,bg,cat){
 let xm=1+Math.min(S.streak,10)*.03,gm=1+Math.min(S.rebirths||0,5)*.05;const C=CLASSES[S.hero.cls];
 if(C.cat&&C.cat===cat)xm+=.15;if(S.hero.cls==='bar')gm+=.15;xm+=mastB();
 let xp=Math.round(bx*xm),capped=0;const gold=Math.round(bg*gm);
 const before=dayRec().xp||0,CAP=Math.round(XP_CAP*(1+mastB()));if(xp>0&&before+xp>CAP){const over=before+xp-Math.max(before,CAP);capped=Math.floor(over/2);xp-=capped}
 S.xp+=xp;S.totalXp+=xp;S.gold+=gold;S.stats.goldEarned+=gold;if(cat&&S.cat[cat]!=null)S.cat[cat]+=xp;
 const ups=levelLoop();
 return{xp,gold,ups,capped}}

function hitQuest(q){
 if(!q||qDone(q))return null;const T=qTarget(q),D=DIFF[q.diff],mk=qmon(q),pk=perKey(q),sh=!!q.shiny;
 if(q.per!==pk){q.per=pk;q.prog=0}q.prog=(q.prog||0)+1;if(T>1)S.stats.ticks++;
 const fin=q.prog>=T;let bx=T>1?D.xp/T:D.xp,bg=T>1?D.g/T:D.g;
 if(fin&&T>1){bx+=D.xp*.5;bg+=D.g*.5}
 if(fin&&sh){bx+=D.xp*.5;bg+=D.g}
 const r=award(Math.max(1,Math.round(bx)),Math.round(bg),q.cat);
 if(fin){if(q.type==='once'){q.done=true;q.doneAt=Date.now()}else{q.lastDone=pk;q.count=(q.count||0)+1}
  S.bestiary[mk]=(S.bestiary[mk]||0)+1;if(sh){S.shinyDex[mk]=(S.shinyDex[mk]||0)+1;S.stats.shiny++}
  S.stats.done++;dayRec().done++;heal(3);if(q.diff==='b')S.stats.bosses++;if(q.type==='weekly')S.stats.weekly++;if(q.type==='daily')S.stats.daily++;if(T>=20)S.stats.bigMeta++;
  addLog(`${sh?'✦ ':''}${mname(mk)} derrotad${art(mk)} — ${q.title}`,r.xp,r.gold,q.cat);S.log[0].q=1;
  if(q.type!=='once')rollMon(q);}
 else addLog(`Golpe ${q.prog}/${T} — ${q.title}`,r.xp,r.gold,q.cat);
 return{q,mk,sh,fin,r,prog:q.prog,T}}
function extra(id){const q=S.quests.find(x=>x.id===id);if(!q||!canExtra(q))return;const T=qTarget(q);
 if(exN(q)>=T){toast(`<div class="grow mut" style="font-size:14px">Limite de extras de hoje atingido (+${T}). Que tal aumentar a meta?</div>`);return}
 undoSnap=null;$('#toast').classList.remove('show');const snap=JSON.stringify(S);const D=DIFF[q.diff];
 const r=award(Math.max(1,Math.round(D.xp/T*1.25)),Math.max(1,Math.round(D.g/T*1.25)),q.cat);
 if(q.exK!==exKey(q)){q.exK=exKey(q);q.exN=0}q.exN++;S.stats.extras=(S.stats.extras||0)+1;const dr=dayRec();dr.ex=(dr.ex||0)+1;
 addLog(`★ Extra +${q.exN} — ${q.title}`,r.xp,r.gold,q.cat);
 const got=checkAch();save();render();SFX.hit();setTimeout(()=>tone(1320,.08,0,'square',.05),90);
 const row=$('.q [data-act="extra"][data-id="'+q.id+'"]');if(row){const el=row.closest('.q');el.classList.add('crit');el.insertAdjacentHTML('beforeend','<b class="critpop px">CRÍTICO!</b>');}
 levelUps(r.ups,()=>achToasts(got,()=>undoToast(snap,`★ Extra +${q.exN}/${T} ${esc(q.unit||'')} · +${r.xp} EXP +${r.gold} G`)))}
function weekBoss(){const wk=weekKey(),h=hashStr('wb'+wk),P=DIFF.b.pool;return{wk,mk:P[h%P.length],sh:h%12===0}}
function weeklyBossCheck(){const W=QA().filter(q=>q.type==='weekly');if(W.length<2)return null;const B=weekBoss();if(S.wboss===B.wk||!W.every(qDone))return null;
 S.wboss=B.wk;const r=award(B.sh?225:150,B.sh?110:55,null);S.bestiary[B.mk]=(S.bestiary[B.mk]||0)+1;if(B.sh){S.shinyDex[B.mk]=(S.shinyDex[B.mk]||0)+1;S.stats.shiny++}
 S.stats.bosses++;S.stats.wboss=(S.stats.wboss||0)+1;heal(30);addLog(`👑 Chefe da Semana derrotado: ${mname(B.mk)}`,r.xp,r.gold);
 return{boss:1,fin:1,mk:B.mk,sh:B.sh,r,q:{unit:''},T:1}}
function complete(id){
 const q=S.quests.find(x=>x.id===id);if(!q||qDone(q)||!qActive(q)||q.archived)return;undoSnap=null;$('#toast').classList.remove('show');const snap=JSON.stringify(S);
 touchStreak();const evs=[hitQuest(q)];const L=q.link&&q.link!==q.id&&S.quests.find(x=>x.id===q.link);if(L)evs.push(hitQuest(L));
 const E=evs.filter(Boolean),ups=[];E.forEach(e=>ups.push(...e.r.ups));const WB=weeklyBossCheck();if(WB){E.push(WB);ups.push(...WB.r.ups)}
 checkDay();const got=checkAch();save();render();
 const fins=E.filter(e=>e.fin),main=E[0];
 const linkTxt=E[1]?` · ${esc(E[1].q.title)}: ${E[1].fin?'concluída!':E[1].prog+'/'+E[1].T}`:'';
 const end=()=>levelUps(ups,()=>achToasts(got,()=>undoToast(snap,fins.length?'Missão concluída.':`Golpe! ${main.prog}/${main.T} ${esc(q.unit||'')} · +${main.r.xp} EXP${linkTxt}`)));
 if(!fins.length){SFX.hit();const m=$('.q [data-id="'+q.id+'"]');end();return}
 const run=i=>{if(i>=fins.length){end();return}const e=fins[i];
  if(e.boss){battle(e.mk,'Chefe da Semana: '+mname(e.mk),`${esc(S.hero.name)} derrotou o CHEFE DA SEMANA!\n${e.sh?'✦ ':''}${mname(e.mk)} caiu diante de você!\n+${e.r.xp} EXP   +${e.r.gold} G`,()=>run(i+1),e.sh);return}
  battle(e.mk,mname(e.mk),`${esc(S.hero.name)} derrotou ${art(e.mk)} ${e.sh?'✦ ':''}${mname(e.mk)}!${e.T>1?`\nMeta cumprida: ${e.T}/${e.T} ${e.q.unit||''}`:''}${e.sh?'\nMonstro especial: recompensa em dobro!':''}\n+${e.r.xp} EXP   +${e.r.gold} G`,()=>run(i+1),e.sh)};
 run(0);
}

const LOOKS={normal:{n:'Normal',bg:'#0b0f2a',sw:['#26348f','#111952','#ffd447','#e9ecff']},light:{n:'Claro',bg:'#e9edf8',sw:['#ffffff','#e1e6f6','#a8650a','#3c4a9e']},dracula:{n:'Escuro',bg:'#282a36',sw:['#343746','#21222c','#ff79c6','#bd93f9']}};
let _orient=null;
function applyOrient(){const o=S.orient||'auto';if(o===_orient)return;_orient=o;try{const so=screen.orientation;if(!so)return;if(o==='auto'){so.unlock&&so.unlock()}else if(so.lock){so.lock(o==='land'?'landscape':'portrait').catch(()=>{})}}catch(e){}}
function applyLook(){const b=document.body;if(!b)return;applyOrient();const t=LOOKS[S.uiTheme]?S.uiTheme:'normal';b.classList.remove('th-light','th-dracula','lay-modern');if(t!=='normal')b.classList.add('th-'+t);if((S.layout||'modern')==='modern')b.classList.add('lay-modern');const m=document.querySelector('meta[name=theme-color]');if(m)m.content=LOOKS[t].bg}
function render(){applyLook();
 const A=$('#app');
 if(!S.hero){A.innerHTML=viewOnboard();$('#tabs').style.display='none';return}
 $('#tabs').style.display='';
 document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.id===tab));
 A.innerHTML=tab==='focus'?viewFocus():tab==='progress'?viewProgress():tab==='tavern'?viewTavern():tab==='hero'?viewHero():tab==='inv'?viewInv():viewQuests();
}

document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const f=ACT[el.dataset.act];if(f){e.preventDefault();f(el.dataset.id,el,e)}});
document.addEventListener('change',e=>{if(e.target.id!=='bkin'||!e.target.files[0])return;const r=new FileReader();r.onload=()=>{try{const o=parseSave(r.result);ask(`Importar o backup de <b>${esc(o.hero.name)}</b> (nível ${o.level})? O progresso atual deste aparelho será substituído.`,'Importar',()=>{S=migrate(o);checkStreak();S.lastBackup=Date.now();save();render();toast('<div class="grow">Backup importado com sucesso!</div>')},false)}catch(err){toast('<div class="grow">Arquivo inválido.</div>')}};r.readAsText(e.target.files[0])});
function parseSave(txt){txt=String(txt).trim();let o;try{o=JSON.parse(txt)}catch(e){o=JSON.parse(decodeURIComponent(escape(atob(txt))))}if(o&&o.save)o=o.save;if(!o||!o.hero)throw 0;return o}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='ftitle')saveQuest();if(e.key==='Enter'&&e.target.id==='obname')ACT.obgo()});

/* ===================== loop do foco / virada de dia ===================== */
const TUT_VER=2;
const TUT=[
 {ic:()=>mon('goblin',60),who:'Rei',t:'Missões',d:'Cada tarefa do seu dia é um <b>monstro</b>. Toque em <b>Atacar</b> (ou <b>+1</b> nas metas com contador) para derrotá-lo e ganhar EXP e ouro. Bateu a meta e quer ir além? Use <b>+1 extra</b>: cada unidade a mais rende 25% de bônus (até o dobro da meta por dia). Comece pelo <b>📜 Quadro de Modelos</b> ou crie em <b>+ Nova missão</b>: únicas, diárias (com os dias da semana) ou semanais. A dificuldade define o monstro e a recompensa; <b>Chefe</b> só vale para únicas e semanais.'},
 {ic:()=>mon('dragon',60),who:'Rei',t:'Rotina e sequência',d:'Complete ao menos uma missão por dia para manter o fogo 🔥: cada dia seguido dá <b>+3% de EXP</b> (até +30%). Vencendo todas as semanais, surge o <b>👑 Chefe da Semana</b>. Depois de <b>600 EXP no mesmo dia</b>, o EXP extra vale metade: constância vale mais que maratona.'},
 {ic:()=>`<div class="row" style="justify-content:center;gap:10px">${potion(48)}${elixir(48)}</div>`,who:'Mestre',t:'Batalha de foco',d:'Um Pomodoro em forma de batalha: escolha 15, 25, 50 ou 90 minutos e foque até o monstro cair. A cada 25 min você ganha uma <b>Poção de Descanso</b> (5 min); a cada 4 poções, um <b>Elixir</b> (pausa longa). Dá para pausar, mas fugir faz o monstro escapar.'},
 {ic:()=>'<span style="font-size:52px">▤</span>',who:'Rei',t:'Status',d:'Veja o <b>relatório da semana</b>, a evolução do seu EXP por área e o <b>diário</b> do que você fez. Ótimo para revisar a semana no domingo.'},
 {ic:()=>svg(KEEPER.rows,KEEPER.pal,64),who:'Taverneiro',t:'Loja',d:'Na Taverna você gasta ouro com o <b>Cardápio</b> de recompensas reais (toque em <b>+ Sugestões do Taverneiro</b>), itens úteis como o <b>Escudo de Sequência</b>, e o <b>Arsenal</b>: cores, armas, acessórios, técnicas, auras, <b>títulos</b> e os <b>trajes lendários</b>.'},
 {ic:()=>hero(S.hero.cls,72),who:'Taverneiro',t:'Itens',d:'Tudo o que você compra fica na aba <b>Itens</b>: <b>Visual</b> (cor, acessório e traje), <b>Combate</b> (arma e técnica), <b>Aura</b>, <b>Título</b>, <b>Figurino</b> e consumíveis. Equipar é só tocar.'},
 {ic:()=>`<div class="row" style="justify-content:center;gap:2px;align-items:flex-end">${[0,1,2].map(i=>hero(S.hero.cls,40,null,i)).join('')}${hero(S.hero.cls,48,null,3,null,{path:'light'})}</div>`,who:'Rei',t:'A jornada do herói',d:'Você <b>evolui nos níveis 10 e 20</b>. No 30 e no 35 liberam os <b>trajes Dourado e Platinado</b>. No <b>40, a Ascensão</b>: escolha Luz ou Trevas, e a Taverna passa a vender <b>variantes de cor</b> para as formas ascendidas. O <b>50</b> é o máximo: os dois caminhos ficam livres e você pode <b>renascer</b>, inclusive em outra classe, levando as formas conquistadas para o <b>Figurino</b>. Cada classe dominada dá <b>+50% de EXP</b> nas próximas (Bônus de Mestria).'},
 {ic:()=>`<div class="row" style="justify-content:center;gap:6px">${mon('saci',52)}${mon('abobora',52)}</div>`,who:'Rei',t:'Bestiário e eventos',d:'Cada monstro derrotado entra no <b>bestiário</b> (aba Herói), inclusive os do <b>folclore brasileiro</b>. No Carnaval, na Páscoa, na Festa Junina, no Halloween e no Natal surgem <b>monstros de evento</b> só naquela semana. Há 1 chance em 12 de aparecer uma versão <span class="shn">✦ especial</span>, com recompensa em dobro.'},
 {ic:()=>'<span style="font-size:52px">⚙</span>',who:'Rei',t:'Configurações',d:'Na aba Herói você ajusta <b>tema</b> (Normal, Claro, Escuro), <b>layout</b> (Clássico ou Moderno), <b>orientação da tela</b>, <b>dificuldade</b>, sons e o <b>Modo desafio</b> com HP. Faça <b>backup do save</b> de vez em quando: ele leva seu progresso para outro aparelho.'},
 {ic:()=>heroA(80),who:'Rei',t:'Boa jornada!',d:'Agora é com você, herói. Pode rever este tutorial quando quiser em <b>Configurações › Tutorial</b>.'}];
function tutorial(i){if(i>=TUT.length){S.tutDone=true;S.tutVer=TUT_VER;save();closeModal();render();return}const t=TUT[i];
 modal(`<div class="tut"><div class="tic">${t.ic()}</div><h2 style="justify-content:center">${t.t}</h2><div class="tb" style="text-align:left"><span class="who">${t.who}:</span> ${t.d}</div>
  <div class="dots">${TUT.map((_,k)=>`<i class="${k===i?'on':''}"></i>`).join('')}</div><div class="mut" style="font-size:12px;margin-top:4px">${i+1} de ${TUT.length}</div></div>
  <div class="actions">${i>0?`<button class="btn ghost" data-act="tut" data-id="${i-1}">◀</button>`:''}<button class="btn ghost" data-act="tut" data-id="${TUT.length}">Pular</button><button class="btn" data-act="tut" data-id="${i+1}">${i<TUT.length-1?'Próximo':'Começar!'}</button></div>`)}
function tutNews(){modal(`<div class="tut"><div class="tic">${svg(KEEPER.rows,KEEPER.pal,64)}</div><h2 style="justify-content:center">Muita coisa nova!</h2><div class="tb" style="text-align:left"><span class="who">Taverneiro:</span> O reino mudou bastante: Ascensão, trajes lendários, Figurino, monstros do folclore e de eventos, temas e mais. Quer ver o tutorial atualizado?</div></div>
  <div class="actions"><button class="btn ghost" data-act="tutlater">Agora não</button><button class="btn" data-act="tut" data-id="0">Ver tutorial</button></div>`)}
let lastDay=today();
function finishFocus(){const f=S.focus;if(!f)return;notify('Batalha de foco vencida!','Hora de descansar: abra o app para beber sua poção.');S.focus=null;const F0=FOCUS.find(x=>x.min===f.min)||FOCUS[1];
 touchStreak();const pots=addFocusTime(f.min);const r=award(f.shiny?Math.round(f.min*1.5):f.min,Math.round(f.min/5*.7)*(f.shiny?2:1),f.cat);S.bestiary[F0.m]=(S.bestiary[F0.m]||0)+1;if(f.shiny){S.shinyDex[F0.m]=(S.shinyDex[F0.m]||0)+1;S.stats.shiny++}S.stats.focus++;S.stats.focusMin+=f.min;dayRec().focus+=f.min;
 addLog(`${f.shiny?'✦ ':''}${F0.n} derrotad${art(F0.m)} (${f.min} min de foco)`,r.xp,r.gold,f.cat);checkDay();const got=checkAch();save();render();
 battle(F0.m,F0.n,`Foco absoluto! ${art(F0.m).toUpperCase()} ${F0.n} foi derrotad${art(F0.m)}!\n+${r.xp} EXP   +${r.gold} G${(pots.p||pots.e)?`\nVocê obteve ${restTxt(pots)}!`:''}`,()=>levelUps(r.ups,()=>achToasts(got)),f.shiny)}
function finishRest(){notify('Descanso concluído!','HP e MP restaurados. Hora de voltar à batalha!');S.rest=null;save();render();SFX.rest();
 const B=$('#battle');B.innerHTML=`<div class="stage"><div class="rays"></div><div class="jump">${hero(S.hero.cls,130)}</div></div>
  <div class="win" style="margin-top:16px"><div class="tb" id="rtxt"></div><button class="btn wide" id="rok" style="margin-top:12px">Voltar à aventura</button></div>`;
 B.classList.add('show');typeText($('#rtxt'),`Descanso concluído!\nO HP e o MP de ${S.hero.name} foram totalmente restaurados.\nHora de voltar à batalha!`);
 $('#rok').onclick=e=>{e.stopPropagation();B.classList.remove('show')}}
setInterval(()=>{
 if(S.rest){const left=S.rest.endAt-Date.now();if(left<=0)finishRest();
  else if(tab==='focus'){const t=$('#rtime'),hp=$('#rhp');if(t)t.textContent=z(Math.floor(left/60000))+':'+z(Math.floor(left/1000)%60);if(hp)hp.style.width=(100-left/(S.rest.min*60000)*100)+'%'}}
 if(S.focus&&!S.focus.pausedAt){const left=S.focus.endAt-Date.now();if(left<=0)finishFocus();
  else if(tab==='focus'){const t=$('#ftime'),hp=$('#fhp');if(t)t.textContent=z(Math.floor(left/60000))+':'+z(Math.floor(left/1000)%60);if(hp)hp.style.width=(left/(S.focus.min*60000)*100)+'%'}}
 if(today()!==lastDay){lastDay=today();checkStreak();save();if(!$('#modal').classList.contains('show'))render()}
},1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.hero&&!$('#modal').classList.contains('show')&&!$('#battle').classList.contains('show'))render()});

render();
if(S.hero&&!S.tutDone&&!$('#modal').classList.contains('show'))setTimeout(()=>tutorial(0),500);else if(S.hero&&S.tutDone&&(S.tutVer||1)<TUT_VER)setTimeout(()=>{if(!$('#modal').classList.contains('show'))tutNews()},900);
/* ===================== PWA: offline, notificações, armazenamento ===================== */
syncState='Salvo neste aparelho (use o Backup)';
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
async function notify(t,b){try{if(!S.notif||!('Notification' in window)||Notification.permission!=='granted')return;
 const r=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration();const o={body:b,icon:'icon-192.png',badge:'badge-96.png',vibrate:[200,100,200,100,300],tag:'questlog'};
 if(r)r.showNotification(t,o);else new Notification(t,o)}catch(e){}
 try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
</script>
