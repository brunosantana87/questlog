<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f2a">
<title>Quest Log — RPG de Produtividade</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
@font-face{font-family:'DotGothic16';src:url(dotgothic16.woff2) format('woff2');font-display:swap}
@font-face{font-family:'DotGothic16';src:url(dotgothic16-ext.woff2) format('woff2');font-display:swap;unicode-range:U+0100-024F,U+1E00-1EFF}
@font-face{font-family:'Press Start 2P';src:url(pressstart2p.woff2) format('woff2');font-display:swap}
</style>
<style>
:root{--bg:#0b0f2a;--w1:#26348f;--w2:#111952;--line:#e9ecff;--gold:#ffd447;--xp:#4dffb0;--hp:#ff5470;--mut:#aab2e6;--txt:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:'DotGothic16',monospace;font-size:16px;line-height:1.35}
body{min-height:100vh;background:
 radial-gradient(1px 1px at 20% 30%,#fff8,transparent),radial-gradient(1px 1px at 70% 10%,#fff6,transparent),
 radial-gradient(1px 1px at 40% 80%,#fff5,transparent),radial-gradient(1px 1px at 85% 60%,#fff7,transparent),
 radial-gradient(1px 1px at 10% 70%,#fff5,transparent),radial-gradient(ellipse at 50% -10%,#2b1f6b 0%,#0b0f2a 60%);background-attachment:fixed}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
.app{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 150px)}
.px{font-family:'Press Start 2P',monospace;letter-spacing:.5px}
.win{position:relative;background:linear-gradient(180deg,var(--w1),var(--w2));border:3px solid var(--line);border-radius:10px;
 box-shadow:0 0 0 3px #04062a,inset 0 0 0 2px #0a1050,0 6px 0 3px rgba(0,0,0,.35);padding:12px;margin-bottom:14px}
.win h2{margin:0 0 10px;font-size:17px;font-weight:normal;color:var(--gold);display:flex;align-items:center;gap:8px}
.win h2 .cnt{margin-left:auto;font-size:13px;color:var(--mut)}
.mut{color:var(--mut)}
.spr{image-rendering:pixelated;display:block}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
/* header */
.hdr .row{align-items:flex-start}
.avatar{width:64px;height:70px;border:2px solid var(--line);border-radius:8px;background:#0a1050;display:grid;place-items:center;flex-shrink:0}
.name{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:13px;color:var(--mut)}
.lv{font-size:11px;color:var(--gold)}
.bar{height:12px;border:2px solid var(--line);background:#050833;border-radius:3px;overflow:hidden;margin-top:4px}
.bar>i{display:block;height:100%;background:linear-gradient(180deg,#b5ffe0,var(--xp) 45%,#18a86c);transition:width .6s}
.bar.hp>i{background:linear-gradient(180deg,#ffb3c1,var(--hp) 45%,#b02040)}
.bar.st>i{background:linear-gradient(180deg,#fff,currentColor 45%,currentColor)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{font-size:12px;padding:3px 7px;border:2px solid #ffffff55;border-radius:6px;background:#0a1050;white-space:nowrap}
.chip b{color:var(--gold);font-weight:normal}
/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:8px 10px calc(env(safe-area-inset-bottom) + 8px);background:linear-gradient(180deg,transparent,#05072a 35%)}
.tabs .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:linear-gradient(180deg,var(--w1),var(--w2));border:3px solid var(--line);border-radius:10px;padding:6px;box-shadow:0 0 0 3px #04062a}
.tabs button{background:none;border:0;padding:6px 2px;border-radius:6px;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--mut)}
.tabs button .ic{font-size:18px;line-height:1}
.tabs button.on{color:#fff;background:#ffffff1a}

@keyframes blink{50%{opacity:0}}
/* buttons */
.btn{background:linear-gradient(180deg,#ffe58a,#e2a92a);color:#2a1800;border:3px solid #fff3c4;border-radius:8px;padding:8px 12px;box-shadow:0 3px 0 #6e4a00;cursor:pointer;white-space:nowrap}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #6e4a00}
.btn:disabled{filter:grayscale(1) brightness(.6);cursor:not-allowed}
.btn.blue{background:linear-gradient(180deg,#7fb2ff,#3a63d8);color:#fff;border-color:#cfe0ff;box-shadow:0 3px 0 #1b2f78}
.btn.red{background:linear-gradient(180deg,#ff8a9a,#d2334f);color:#fff;border-color:#ffd0d8;box-shadow:0 3px 0 #6e1424}
.btn.ghost{background:#0a1050;color:#fff;border-color:#ffffff66;box-shadow:none}
.btn.sm{padding:5px 9px;font-size:14px}
.btn.wide{width:100%;padding:12px;font-size:17px}
.fab{position:fixed;right:max(14px,calc(50% - 226px));bottom:calc(env(safe-area-inset-bottom) + 92px);z-index:19}
/* quests */
.q{display:flex;align-items:center;gap:10px;padding:9px 4px;border-top:2px dashed #ffffff22}
.q:first-of-type{border-top:0}
.q .mon{width:40px;height:40px;flex-shrink:0;display:grid;place-items:center;background:#0a1050;border-radius:6px;border:2px solid #ffffff33}
.q .t{font-size:16px;word-break:break-word;cursor:pointer}
.q .meta{font-size:12px;color:var(--mut);display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.q .meta .late{color:#ff7d8f}
.q.done{opacity:.5}
.q.done .t{text-decoration:line-through}
.dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:3px;vertical-align:middle}
.seg{display:flex;gap:6px;margin-bottom:12px}
.seg button{flex:1;background:#0a1050;border:2px solid #ffffff44;border-radius:8px;padding:7px 4px;color:var(--mut);font-size:14px}
.seg button.on{border-color:var(--gold);color:#fff;background:#1d2a85}
.empty{text-align:center;color:var(--mut);padding:8px 0}
details summary{cursor:pointer;color:var(--mut);list-style:none;padding:4px 0}
details summary::-webkit-details-marker{display:none}
/* textbox */
.tb{font-size:16px;min-height:3em;white-space:pre-line}
.tb .who{color:var(--gold)}
.sugg{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.sugg button{text-align:left}
/* forms */
label.f{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
.in{width:100%;background:#050833;border:2px solid #ffffff66;border-radius:6px;padding:10px;outline:none}
.in:focus{border-color:var(--gold)}
.pick{display:grid;gap:6px}
.pick.c2{grid-template-columns:1fr 1fr}.pick.c4{grid-template-columns:repeat(4,1fr)}
.pick button{background:#0a1050;border:2px solid #ffffff44;border-radius:8px;padding:7px 4px;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:3px;color:#fff}
.pick button.on{border-color:var(--gold);background:#1d2a85;box-shadow:0 0 0 2px #ffd44755}
.pick small{color:var(--mut);font-size:11px}
/* modal */
.ov{position:fixed;inset:0;z-index:50;background:rgba(2,3,20,.72);display:none;align-items:center;justify-content:center;padding:16px}
.ov.show{display:flex}
.ov .win{width:100%;max-width:440px;max-height:88vh;overflow:auto;margin:0;animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(.9);opacity:0}}
.actions{display:flex;gap:8px;margin-top:14px}.actions .btn{flex:1}
/* battle */
.battle{position:fixed;inset:0;z-index:60;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;
 background:radial-gradient(ellipse at 50% 60%,#3a2a8a,#07092a 70%)}
.battle.show{display:flex}
.battle .stage{position:relative;height:190px;display:grid;place-items:center;width:100%}
.battle .ground{position:absolute;bottom:18px;width:200px;height:24px;border-radius:50%;background:#00000055}
.battle .foe{position:relative;animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.battle .foe.hit{animation:shake .35s linear 2;filter:brightness(3)}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.battle .foe.dead{animation:die .7s forwards}
@keyframes die{to{opacity:0;transform:scale(1.3) translateY(10px);filter:brightness(4) blur(2px)}}
.dmg{position:absolute;top:20px;font-size:26px;color:#fff;text-shadow:3px 3px 0 #c8143a;animation:dmg 1s forwards;opacity:0}
@keyframes dmg{0%{opacity:1;transform:translateY(20px)}60%{opacity:1;transform:translateY(-20px)}100%{opacity:0;transform:translateY(-30px)}}
.slash{position:absolute;width:160px;height:6px;background:#fff;transform:rotate(-35deg) scaleX(0);box-shadow:0 0 12px #fff;opacity:0}
.slash.go{animation:slash .25s ease-out}
@keyframes slash{0%{opacity:1;transform:rotate(-35deg) scaleX(0)}100%{opacity:0;transform:rotate(-35deg) scaleX(1.2)}}
.battle .win{width:100%;max-width:440px}
.lvup{font-size:26px;color:var(--gold);text-shadow:3px 3px 0 #b8541a,0 0 18px #ffd44788;animation:glow .6s ease-in-out infinite alternate;text-align:center;line-height:1.4}
@keyframes glow{to{transform:scale(1.06)}}
.jump{animation:jump .6s ease-in-out infinite}
@keyframes jump{50%{transform:translateY(-14px)}}
.rays{position:absolute;width:260px;height:260px;border-radius:50%;background:repeating-conic-gradient(#ffd44733 0 10deg,transparent 10deg 20deg);animation:spin 8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* focus */
.timer{font-size:34px;text-align:center;margin:10px 0;color:#fff;text-shadow:3px 3px 0 #000}
.potslot{position:relative;width:76px;height:76px;flex-shrink:0;display:grid;place-items:center;background:#0a1050;border:2px solid var(--gold);border-radius:10px;box-shadow:inset 0 0 14px #ff4a6a55}
.potslot.locked{border-color:#ffffff33;box-shadow:none}
.potslot span{position:absolute;right:4px;bottom:3px;font-size:11px;color:#fff;text-shadow:2px 2px 0 #000}
.potslot .lock{font-size:16px;right:2px;bottom:0}
.fab{display:none}
.fabs{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 92px);z-index:19;display:flex;justify-content:flex-end;gap:8px;max-width:480px;margin:0 auto;padding:0 14px;pointer-events:none}
.fabs .btn{pointer-events:auto;white-space:nowrap}
.prog{display:flex;align-items:center;gap:8px;margin-top:5px;font-size:12px;color:var(--mut)}
.prog .bar{flex:1;margin:0;height:9px}
.prog span{white-space:nowrap}
.pips{display:flex;gap:3px;margin-top:4px;flex-wrap:wrap}
.pips i{width:12px;height:12px;border-radius:3px;border:2px solid #ffffff55;background:#050833}
.pips i.on{background:var(--hp);border-color:#ffd0d8}
.q .mon{position:relative}
.spark{position:absolute;top:-6px;right:-6px;color:#ffe066;font-size:13px;text-shadow:0 0 6px #ffd447;animation:blink 1s steps(2) infinite}
.q.shq{background:linear-gradient(90deg,#ffd44718,transparent);border-radius:8px}
.q.shq .mon{border-color:#ffd447;box-shadow:0 0 8px #ffd44788}
.shn{color:#ffe066}
.shiny{filter:drop-shadow(0 0 3px #ffe06688)}
.sparks{position:absolute;inset:0;pointer-events:none;color:#ffe066;font-size:22px;text-shadow:0 0 10px #ffd447}
.sparks{display:flex;justify-content:space-around;align-items:flex-start;animation:zz 1.6s ease-in-out infinite}
.sparks span:nth-child(1){margin-top:60px}.sparks span:nth-child(2){margin-top:20px}
.best div{position:relative}
.best div.gotsh{border-color:#ffd447;cursor:pointer}
.tier{color:var(--mut);font-size:12px;margin:10px 0 6px}
.tplpack{background:#0a1050;border:2px solid #ffffff33;border-radius:10px;padding:10px;margin-top:10px}
.tplit{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px dashed #ffffff22;font-size:14px;cursor:pointer}
.tplit input{width:20px;height:20px;accent-color:#ffd447;flex-shrink:0}
.tplit small{display:block;color:var(--mut);font-size:11px}
.tplit.has{opacity:.55}
select.in{appearance:none;-webkit-appearance:none}
.evo{display:flex;align-items:center;justify-content:center;gap:6px}
.evo div{display:flex;flex-direction:column;align-items:center;gap:2px;background:#0a1050;border:2px solid #ffffff33;border-radius:8px;padding:6px 4px;flex:1;min-width:0;font-size:12px;text-align:center}
.evo div.cur{border-color:var(--gold);box-shadow:0 0 0 2px #ffd44755}
.evo div.off span{color:var(--mut)}
.evo i{font-style:normal;font-size:9px;color:var(--gold)}
.evo b{color:var(--gold);font-weight:normal;font-size:12px}
.evoswap{position:relative;width:110px;height:140px}
.evoswap>div{position:absolute;inset:0;display:grid;place-items:center}
.ev0{animation:evo0 1.8s forwards}.ev1{opacity:0;animation:evo1 1.8s forwards}
@keyframes evo0{0%,20%{opacity:1;filter:none}25%,35%,45%,55%,65%{opacity:1;filter:brightness(5)}30%,40%,50%,60%{opacity:.3}75%,100%{opacity:0;filter:brightness(5)}}
@keyframes evo1{0%,70%{opacity:0;filter:brightness(5)}85%{opacity:1;filter:brightness(3)}100%{opacity:1;filter:none}}
.sec>summary{list-style:none;cursor:pointer}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary h2{margin:0}
.sec[open]>summary h2{margin-bottom:10px}
.sec .arw{font-style:normal;display:inline-block;transition:transform .15s;font-size:13px;color:var(--mut)}
.sec[open] .arw{transform:rotate(90deg)}
.invitem{background:#0a1050;border:2px solid #ffffff33;border-radius:10px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-width:0}
.invitem .potslot{width:70px;height:70px}
.invitem .iname{color:var(--gold)}
.invitem .btn{margin-top:4px;width:100%}
.potslot.elx{border-color:#38e8c8;box-shadow:inset 0 0 14px #38e8c855}
.potslot.elx.locked{border-color:#ffffff33;box-shadow:none}
.shine{animation:shine 1.6s ease-in-out infinite}
@keyframes shine{50%{filter:brightness(1.35) drop-shadow(0 0 4px #38e8c8)}}
.cycle{display:flex;align-items:center;gap:6px;margin-top:10px;flex-wrap:wrap}
.cycle .sub{margin-right:4px}
.cycle i{display:grid;place-items:center;width:28px;height:28px;border-radius:6px;border:2px solid #ffffff33;background:#0a1050}
.cycle i.on{border-color:#ff6b85}
.cycle i.next{border-color:#38e8c8;animation:blink 1s steps(2) infinite}
.cycle b{color:var(--mut);font-weight:normal}
.sfx{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px dashed #ffffff22;font-size:14px}
.sfx .grow small{display:block;color:var(--mut);font-size:12px}
.potchip{display:inline-flex;align-items:center;gap:4px}
.restscene{position:relative;height:160px;display:flex;align-items:flex-end;justify-content:center;gap:14px;padding-bottom:10px}
.restscene .fire{animation:bob 1.4s ease-in-out infinite;margin-bottom:6px}
.zzz{position:absolute;left:calc(50% - 30px);top:6px;color:#bfe6ff;font-size:12px;animation:zz 2.4s ease-in-out infinite}
.zzz span{display:inline-block;margin-left:4px;transform:translateY(-8px);font-size:14px}.zzz span+span{transform:translateY(-18px);font-size:17px}
@keyframes zz{0%{opacity:0;transform:translateY(10px)}30%{opacity:1}100%{opacity:0;transform:translateY(-12px)}}
.frozen{filter:grayscale(1) brightness(.75)}
.paused{text-align:center;color:#8ac0ff;font-size:12px;margin-top:10px}
.blinkt{animation:blink 1s steps(2) infinite}
.focusfoe{display:grid;place-items:center;height:150px}
/* tavern */
.rw{display:flex;align-items:center;gap:10px;padding:9px 2px;border-top:2px dashed #ffffff22}
.rw:first-of-type{border-top:0}
.price{color:var(--gold);font-size:13px}
.x{background:none;border:0;color:#ff7d8f;font-size:18px;padding:4px 6px}
/* hero */
.stat{display:grid;grid-template-columns:48px 1fr 34px;align-items:center;gap:8px;margin:7px 0;font-size:14px}
.stat .bar{margin:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kv{background:#0a1050;border:2px solid #ffffff33;border-radius:8px;padding:8px;text-align:center}
.kv b{display:block;font-size:13px;color:var(--gold);font-weight:normal}
.kv span{font-size:12px;color:var(--mut)}
.best{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.best div{background:#0a1050;border:2px solid #ffffff33;border-radius:8px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;text-align:center;min-width:0;overflow-wrap:anywhere}
.best div i{font-style:normal;color:var(--gold);font-size:11px}
.best div.off span{color:var(--mut)}
.ach{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.ach div{background:#0a1050;border:2px solid #ffffff33;border-radius:8px;padding:8px;font-size:13px}
.ach div.on{border-color:var(--gold);background:linear-gradient(180deg,#3a2f6e,#1a1f60)}
.ach div i{font-style:normal;display:block;color:var(--mut);font-size:11px}
.ach div.off{opacity:.45}
.log{font-size:13px;max-height:260px;overflow:auto}
.log div{padding:5px 0;border-top:1px dashed #ffffff22;display:flex;gap:8px}
.log div span:last-child{margin-left:auto;color:var(--xp);white-space:nowrap}
/* toast */
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 92px);transform:translateX(-50%);z-index:70;width:calc(100% - 24px);max-width:440px;display:none}
.toast.show{display:block;animation:pop .2s}
.toast .win{margin:0;display:flex;align-items:center;gap:10px;padding:10px 12px}
/* onboarding */
.logo{display:flex;justify-content:center;margin:18px 0 6px}
.topbar{display:flex;justify-content:center;margin:2px 0 10px}
.skins{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:4px}
.skins button{width:38px;height:38px;border-radius:50%;border:3px solid #ffffff55;padding:0;cursor:pointer}
.skins button.on{border-color:var(--gold);box-shadow:0 0 0 3px #ffd44766;transform:scale(1.08)}
/* evita textos escapando das caixas */
.app,.win,.ov .win{overflow-wrap:break-word;word-wrap:break-word}
.btn{white-space:normal;line-height:1.25;max-width:100%}
.q .btn,.rw .btn,.switch .btn,.toast .btn,.fab{white-space:nowrap}
.sugg button{text-align:left;width:100%;font-size:15px;line-height:1.3}
.sugg button .mut{display:block;font-size:12px;margin-top:2px}
.pick button,.classes button{min-width:0;overflow-wrap:anywhere;text-align:center}
.pick button{font-size:12px;padding:7px 2px}
.chips .chip{max-width:100%}
.tb{overflow-wrap:break-word}
.log div span:nth-child(2){min-width:0;overflow-wrap:anywhere}
.kv{min-width:0;overflow-wrap:anywhere}
.tag{text-align:center;color:var(--mut);margin-bottom:18px;font-size:14px}
.classes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.classes button{background:#0a1050;border:2px solid #ffffff44;border-radius:8px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;color:#fff}
.classes button.on{border-color:var(--gold);background:#1d2a85;box-shadow:0 0 0 2px #ffd44755}
.classes small{color:var(--mut);font-size:12px;text-align:center}
.switch{display:flex;justify-content:space-between;align-items:center;padding:6px 0}
textarea.in{min-height:90px;font-size:12px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav class="tabs" id="tabs" style="display:none"><div class="in">
 <button data-act="tab" data-id="quests"><span class="ic">⚔</span>Missões</button>
 <button data-act="tab" data-id="focus"><span class="ic">⧗</span>Foco</button>
 <button data-act="tab" data-id="tavern"><span class="ic">♦</span>Taverna</button>
 <button data-act="tab" data-id="hero"><span class="ic">♛</span>Herói</button>
</div></nav>
<div class="ov" id="modal"></div>
<div class="battle" id="battle"></div>
<div class="toast" id="toast"></div>

<script>
/* ===================== utilidades ===================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const z=n=>String(n).padStart(2,'0');
const dstr=d=>d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate());
const today=()=>dstr(new Date());
const yesterday=()=>{const d=new Date();d.setDate(d.getDate()-1);return dstr(d)};

const perKey=q=>q.type==='daily'?today():q.type==='weekly'?weekKey():'all';
const qDone=q=>q.type==='once'?!!q.done:q.lastDone===perKey(q);
const qTarget=q=>Math.max(1,+q.target||1);
const qProg=q=>qDone(q)?qTarget(q):(q.per===perKey(q)?(q.prog||0):0);
const SHINY_RATE=1/12;
function rollMon(q){q.mon=pickMon(q.diff);q.shiny=Math.random()<SHINY_RATE}
function toHsl(hex){const r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2;let h=0,s=0;
 if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h*=60}return[h,s,l]}
function toHex(h,s,l){const f=n=>{const k=(n+h/30)%12,a=s*Math.min(l,1-l),c=l-a*Math.max(-1,Math.min(k-3,9-k,1));return Math.round(c*255).toString(16).padStart(2,'0')};return '#'+f(0)+f(8)+f(4)}
const SHC={};
function shinyPal(k){if(SHC[k])return SHC[k];const P=SPR[k].pal,o={};for(const c in P){const[h,s,l]=toHsl(P[c]);if(l<.13){o[c]=P[c];continue}
 o[c]=s<.18?toHex(45,.65,Math.min(.92,l)):toHex((h+150)%360,Math.min(1,s*1.05),l)}return SHC[k]=o}

/* ===================== loop do foco / virada de dia ===================== */
let lastDay=today();
function finishFocus(){const f=S.focus;if(!f)return;notify('Batalha de foco vencida!','Hora de descansar: abra o app para beber sua poção.');S.focus=null;const F0=FOCUS.find(x=>x.min===f.min)||FOCUS[1];
 touchStreak();const pots=addFocusTime(f.min);const r=award(f.shiny?Math.round(f.min*1.5):f.min,Math.round(f.min/5)*(f.shiny?2:1),f.cat);S.bestiary[F0.m]=(S.bestiary[F0.m]||0)+1;if(f.shiny){S.shinyDex[F0.m]=(S.shinyDex[F0.m]||0)+1;S.stats.shiny++}S.stats.focus++;S.stats.focusMin+=f.min;
 addLog(`${f.shiny?'✦ ':''}${F0.n} derrotad${art(F0.m)} (${f.min} min de foco)`,r.xp,r.gold,f.cat);checkDay();const got=checkAch();save();render();
 battle(F0.m,F0.n,`Foco absoluto! ${art(F0.m).toUpperCase()} ${F0.n} foi derrotad${art(F0.m)}!\n+${r.xp} EXP   +${r.gold} G${(pots.p||pots.e)?`\nVocê obteve ${restTxt(pots)}!`:''}`,()=>levelUps(r.ups,()=>achToasts(got)),f.shiny)}
function finishRest(){notify('Descanso concluído!','HP e MP restaurados. Hora de voltar à batalha!');S.rest=null;save();render();SFX.rest();
 const B=$('#battle');B.innerHTML=`<div class="stage"><div class="rays"></div><div class="jump">${hero(S.hero.cls,130)}</div></div>
  <div class="win" style="margin-top:16px"><div class="tb" id="rtxt"></div><button class="btn wide" id="rok" style="margin-top:12px">Voltar à aventura</button></div>`;
 B.classList.add('show');typeText($('#rtxt'),`Descanso concluído!\nO HP e o MP de ${S.hero.name} foram totalmente restaurados.\nHora de voltar à batalha!`);
 $('#rok').onclick=e=>{e.stopPropagation();B.classList.remove('show')}}
setInterval(()=>{
 if(S.rest){const left=S.rest.endAt-Date.now();if(left<=0)finishRest();
  else if(tab==='focus'){const t=$('#rtime'),hp=$('#rhp');if(t)t.textContent=z(Math.floor(left/60000))+':'+z(Math.floor(left/1000)%60);if(hp)hp.style.width=(100-left/(S.rest.min*60000)*100)+'%'}}
 if(S.focus&&!S.focus.pausedAt){const left=S.focus.endAt-Date.now();if(left<=0)finishFocus();
  else if(tab==='focus'){const t=$('#ftime'),hp=$('#fhp');if(t)t.textContent=z(Math.floor(left/60000))+':'+z(Math.floor(left/1000)%60);if(hp)hp.style.width=(left/(S.focus.min*60000)*100)+'%'}}
 if(today()!==lastDay){lastDay=today();checkStreak();if(!$('#modal').classList.contains('show'))render()}
},1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.hero&&!$('#modal').classList.contains('show')&&!$('#battle').classList.contains('show'))render()});

render();
/* ===================== PWA: offline, notificações, armazenamento ===================== */
syncState='Salvo neste aparelho (use o Backup)';
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
async function notify(t,b){try{if(!S.notif||!('Notification' in window)||Notification.permission!=='granted')return;
 const r=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration();const o={body:b,icon:'icon-192.png',badge:'badge-96.png',vibrate:[200,100,200,100,300],tag:'questlog'};
 if(r)r.showNotification(t,o);else new Notification(t,o)}catch(e){}
 try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
</script>
</body>
</html>
